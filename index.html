<body>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Diseño "Lila y ciruela suave" (antes Ciruela y coral): cabecera ciruela con saludo y tarjetas de cada perro (filtran toda la app), contenido sobre crema en una columna (máx. 880px), tarjeta coral para lo atrasado y menú inferior fijo tipo app. Un solo look claro. */
:root {
  --plum: #2B1036;
  --plum-2: #3D1B4C;
  --purple: #5A2D6B;
  --ink: #2E1A3A;
  --coral: #FF8A6A;
  --coral-soft: #FFB39E;
  --coral-ink: #5A2D6B;
  --cream: #F8F2EA;
  --pink: #EBDDF1;
  --pink-2: #F4ECF7;
  --lilac-2: #DCC6E8;
  --bg: #F8F2EA;
  --surface: #FFFDF9;
  --surface-2: #F1E8EE;
  --line: #EDE3D8;
  --line-2: #F0E7DE;
  --muted: #8B7B94;
  --muted-2: #7C6B86;
  --ok: #3F7A43; --ok-bg: #E1ECDD;
  --warn: #8F5E10; --warn-bg: #F5E7C8;
  --danger: #B8434F; --danger-bg: #FADADD;
  --soft: #6E5D78;
  --peach: #FBE4D8; --peach-ink: #C9643F;
  --sage: #E1ECDD; --sage-ink: #4F7F4B;
  --sand: #F5E7C8; --sand-ink: #946414;
  --rose: #FADADD; --rose-ink: #B8434F;
  --shadow: 0 1px 0 rgba(46, 26, 58, .03), 0 10px 24px rgba(46, 26, 58, .05);
  --font-display: 'Lora', Georgia, 'Times New Roman', serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.45;
  padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--purple); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; color: var(--ink); letter-spacing: -.01em; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }

/* Cabecera ciruela */
.hero {
  background: radial-gradient(120% 90% at 85% 0%, #6B2E7E 0%, #3A1A4C 45%, #24102F 100%);
  color: var(--cream);
  border-radius: 0 0 34px 34px;
  padding: max(22px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.hero { position: relative; overflow: hidden; }
.hero-in { max-width: 880px; margin: 0 auto; position: relative; z-index: 1; }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.hero .cfs { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.hero .cfs i { position: absolute; width: 7px; height: 12px; border-radius: 2px; opacity: .85; }
.facewrap { position: relative; flex: none; display: block; }
.hat { position: absolute; top: -15px; left: 50%; width: 26px; height: 30px; transform: translateX(-30%) rotate(16deg); pointer-events: none; }
.hat svg { width: 100%; height: 100%; display: block; overflow: visible; }
.notif { position: fixed; z-index: 40; width: min(360px, calc(100vw - 24px)); max-height: min(70vh, 520px); overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 22px; box-shadow: 0 18px 50px rgba(36, 16, 47, .28), 0 2px 8px rgba(36, 16, 47, .12); padding: 8px; }
.notif h4 { margin: 0; padding: 10px 12px 6px; font: 600 20px var(--font-display); }
.notif .ng { font: 700 11px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 10px 12px 4px; }
.notif .ni { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; border-radius: 14px; background: transparent; text-align: left; color: inherit; font: inherit; }
.notif .ni:hover, .notif .ni:focus-visible { background: var(--cream); }
.notif .ni .dogface { width: 40px; height: 40px; }
.notif .ni .facewrap .hat { top: -11px; width: 20px; height: 24px; }
.notif .nt { font-size: 13.5px; line-height: 1.35; min-width: 0; overflow-wrap: anywhere; }
.notif .nt b { font-weight: 700; }
.notif .ns { display: block; font-size: 12px; font-weight: 600; margin-top: 1px; }
.notif .ns.bad { color: var(--danger); } .notif .ns.warn { color: var(--warn); } .notif .ns.soft { color: var(--muted); } .notif .ns.party { color: var(--purple); }
.notif .ndot { width: 9px; height: 9px; border-radius: 50%; background: var(--coral); }
.notif .nempty { padding: 18px 12px 20px; font-size: 14px; color: var(--muted); text-align: center; }
.notif .nfoot { display: block; width: 100%; margin-top: 4px; padding: 10px; border: 0; border-top: 1px solid var(--line-2); background: none; font: 600 13.5px var(--font-body); color: var(--coral-ink); }
.dogs.party { padding-top: 14px; margin-top: 8px; }
.bday { position: relative; overflow: hidden; border-radius: 26px; padding: 18px 20px; background: var(--pink); color: var(--ink); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 16px; align-items: center; }
.bday::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background: radial-gradient(circle at 96% 10%, var(--coral) 0 4px, transparent 5px), radial-gradient(circle at 90% 22%, var(--purple) 0 3px, transparent 4px), radial-gradient(circle at 98% 34%, #FFD27A 0 3px, transparent 4px), radial-gradient(circle at 4% 94%, var(--coral-soft) 0 4px, transparent 5px), radial-gradient(circle at 12% 98%, #FFD27A 0 3px, transparent 4px), radial-gradient(circle at 84% 8%, var(--coral-soft) 0 2px, transparent 3px); }
.bday > * { position: relative; }
.bday .when { grid-column: 1 / -1; justify-self: start; font: 700 11.5px var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--purple); background: var(--surface); padding: 4px 10px; border-radius: 999px; margin-bottom: 6px; }
.bday .agebig { font: 600 64px/0.9 var(--font-display); color: var(--purple); font-variant-numeric: tabular-nums; text-align: center; }
.bday .agebig small { display: block; font: 700 11px var(--font-body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted-2); margin-top: 6px; }
.bday h3 { font-size: 23px; line-height: 1.15; }
.bday p { font-size: 14.5px; margin-top: 4px; color: var(--soft); }
.bday .faces { display: flex; gap: 6px; margin-top: 10px; }
.bday .faces .facewrap { margin-top: 12px; }
.bday .faces .dogface { width: 44px; height: 44px; }
.bday.multi .agebig { font-size: 40px; }
.soon { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 20px; background: var(--surface); box-shadow: var(--shadow); font-size: 14px; }
.soon b { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.soon .pill { flex: none; }
.badge.cumple { background: var(--pink); color: var(--purple); }
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand small { font: 600 12px var(--font-body); letter-spacing: .18em; text-transform: uppercase; color: #F6B8A6; }
.brand h1 { font-size: 30px; line-height: 1.1; color: var(--cream); margin-top: 3px; }
.bell { width: 44px; height: 44px; flex: none; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .12); color: var(--cream); display: grid; place-items: center; position: relative; }
.bell svg { width: 20px; height: 20px; }
.bell b { position: absolute; top: 3px; right: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--coral); color: var(--ink); font-size: 11px; line-height: 18px; font-weight: 700; border: 2px solid var(--plum-2); box-sizing: content-box; }

.dogs { display: flex; gap: 10px; margin-top: 20px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.dogs::-webkit-scrollbar { display: none; }
.dog { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 7px 14px 7px 7px; border-radius: 22px; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .14); color: var(--cream); text-align: left; transition: background .15s, border-color .15s; }
.dog:hover { background: rgba(255, 255, 255, .14); }
.dog[aria-pressed="true"] { background: var(--cream); color: var(--ink); border-color: var(--cream); }
.dog.all { flex: 0 0 auto; padding-right: 14px; }
@media (max-width: 520px) { .dog.all { padding: 7px; } .dog.all .lbl { display: none; } .dogface { width: 44px; height: 44px; } .dog { padding-right: 10px; gap: 8px; } .dog .sub { white-space: normal; line-height: 1.25; } }
.dogface { width: 52px; height: 52px; border-radius: 50%; background: var(--pink); overflow: hidden; flex: none; display: grid; place-items: center; color: var(--purple); }
.dogface > svg { width: 100%; height: 100%; display: block; }
.dogface .paw { width: 26px; height: 26px; fill: currentColor; }
.dog b { font: 600 18px/1.15 var(--font-display); display: block; overflow: hidden; text-overflow: ellipsis; }
.dog > span:last-child { min-width: 0; }
.dog .sub { display: block; font-size: 11.5px; line-height: 1.25; opacity: .75; }
@media (prefers-reduced-motion: reduce) { .dog { transition: none; } }

/* Contenido */
.wrap { max-width: 880px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 22px; }
.wrap > * { min-width: 0; }
.stack { display: grid; gap: 22px; }
.stack > * { min-width: 0; }
.blk { display: grid; gap: 12px; min-width: 0; }
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sh h2 { font-size: 22px; }
.sh h3 { font-size: 21px; }
.link { border: 0; background: none; padding: 4px 0; font: 600 13.5px var(--font-body); color: var(--coral-ink); }
.title-xl { font-size: 28px; }

.card { background: var(--surface); border-radius: 24px; padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card > h3 { font-size: 19px; margin-bottom: 10px; }
.card.flat { padding: 4px 16px; }
.cols { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: start; }

.notice { padding: 11px 15px; border-radius: 16px; background: var(--warn-bg); color: var(--warn); font-size: 13.5px; font-weight: 500; }
.notice.bad { background: var(--danger-bg); color: var(--danger); }
.notice.demo { background: var(--pink); color: var(--purple); }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--cream); font-weight: 600; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { background: var(--plum-2); }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--purple); }
.btn.coral { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn.danger[data-armed] { background: var(--danger); color: #FFFFFF; }
.btn.small { min-height: 36px; padding: 6px 14px; font-size: 13px; }
.btn[disabled] { opacity: .55; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.quick { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.quick::-webkit-scrollbar { display: none; }
.quick .btn { flex: none; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 0; background: var(--surface-2); color: var(--muted-2); font-weight: 600; font-size: 13.5px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); }

/* Alerta coral */
.alert { background: var(--coral); color: var(--ink); border-radius: 26px; padding: 18px 20px; position: relative; overflow: hidden; min-height: 168px; }
.alert small { display: block; font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.alert h3 { font-size: 22px; color: var(--ink); margin: 5px 0 6px; max-width: calc(100% - 96px); }
.alert p { font-size: 13.5px; max-width: calc(100% - 104px); }
.alert .actions { margin-top: 14px; position: relative; z-index: 1; }
.alert .btn.ghost { background: rgba(255, 255, 255, .35); border-color: transparent; }
.alert .art { position: absolute; right: -20px; bottom: -32px; width: 124px; height: 136px; pointer-events: none; }
.alert .art svg { width: 100%; height: 100%; display: block; }
.alert .more { margin-top: 10px; font-size: 12.5px; font-weight: 600; opacity: .8; }

/* Listas */
.row { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 12px; align-items: start; width: 100%; padding: 13px 2px; border: 0; border-top: 1px solid var(--line-2); background: transparent; text-align: left; }
.row:first-child { border-top: 0; }
.rwrap { border-top: 1px solid var(--line-2); }
.rwrap:first-child { border-top: 0; }
.rwrap > .row { border-top: 0; }
.fstrip { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 2px 12px 64px; margin-top: -4px; }
.fchip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 32px; padding: 4px 11px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-size: 12.5px; font-weight: 600; }
.fchip:hover { border-color: var(--purple); }
.fchip .fi2 { width: 24px; height: 24px; flex: none; border-radius: 50%; overflow: hidden; background: var(--pink); color: var(--purple); display: grid; place-items: center; }
.fchip .fi2 img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fchip .fi2 svg { width: 14px; height: 14px; }
.fchip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fchip em { font-style: normal; color: var(--purple); }
.ctlfiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.ctlfiles .drop { padding: 14px 10px; }
.ctlfiles .lab small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; text-transform: none; letter-spacing: 0; }
button.row:hover { background: #FDF9F3; }
.row[data-ro] { cursor: default; }
.datebox { display: grid; justify-items: center; line-height: 1; padding-top: 1px; }
.datebox b { font-family: var(--font-display); font-size: 24px; font-weight: 600; color: var(--ink); }
.datebox i { font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 3px; }
.rbody { display: grid; gap: 4px; min-width: 0; }
.rtitle { font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.rmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--muted); }
.rnotes { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.rnext { font-size: 12.5px; color: var(--purple); font-weight: 700; }
.rfiles { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.rright { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 14px; }
.year { font: 700 12.5px var(--font-body); letter-spacing: .14em; color: var(--muted); padding: 16px 2px 4px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--pink); color: var(--purple); font-size: 11.5px; font-weight: 700; }
.ptag { display: inline-flex; align-items: center; gap: 5px; }
.ptag .dot { width: 9px; height: 9px; border-radius: 50%; }
.tagart { width: 20px; height: 20px; border-radius: 50%; background: var(--pink); overflow: hidden; display: block; }
.tagart svg { display: block; width: 100%; height: 100%; }

.badge { font-family: var(--font-body); letter-spacing: 0; display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.badge.bad { background: var(--danger-bg); color: var(--danger); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.soft { background: var(--surface-2); color: var(--soft); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }

.pend { display: grid; gap: 8px; padding: 13px 0; border-top: 1px solid var(--line-2); }
.pend:first-child { border-top: 0; }
.pend-top { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.pend-top > div { min-width: 0; }
.pend .actions { padding-left: 62px; }

/* Plan del día */
.plan { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.pl { background: var(--surface); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); position: relative; min-width: 0; }
.pl time { font: 600 22px var(--font-display); color: var(--purple); font-variant-numeric: tabular-nums; }
.pl b { display: block; font-size: 13.5px; margin-top: 2px; }
.pl p { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.4; overflow-wrap: anywhere; }
.pl .plpet { display: block; margin-top: 8px; font-size: 12px; color: var(--muted); }
.cal { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; font-size: 12.5px; font-weight: 600; color: var(--purple); text-decoration: none; }
.cal svg { width: 16px; height: 16px; flex: none; }
.cal:hover { text-decoration: underline; }
.calrow { padding-left: 62px; }
.pl .cal { margin-top: 6px; }
.pl.now .cal { color: var(--coral-soft); }
.pl.now { background: var(--ink); color: var(--cream); }
.pl.now time { color: var(--coral-soft); }
.pl.now p, .pl.now .plpet { color: #D9C6E2; }
.pl .nowtag { position: absolute; top: 12px; right: 12px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--coral-soft); }

/* Gastos */
.big { font-family: var(--font-display); font-size: 38px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; color: var(--ink); letter-spacing: -.02em; }
.delta { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.split { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 12px; font-size: 13px; }
.split span { padding: 4px 11px; border-radius: 999px; background: var(--surface-2); }
.split b { font-variant-numeric: tabular-nums; }
.monthnav { display: flex; align-items: center; gap: 8px; }
.monthnav h2 { text-transform: capitalize; min-width: 8ch; text-align: center; font-size: 20px; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; color: var(--ink); }
.iconbtn[disabled] { opacity: .4; cursor: default; }
.bars { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; align-items: end; }
.bar { border: 0; background: transparent; padding: 0; display: grid; gap: 6px; justify-items: center; text-align: center; }
.bar .v { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; min-height: 1.2em; }
.bar .col { width: 100%; height: 110px; display: flex; align-items: flex-end; }
.bar .fill { width: 100%; height: var(--h); min-height: 4px; border-radius: 10px 10px 4px 4px; background: var(--pink); }
.bar[aria-pressed="true"] .fill { background: var(--purple); }
.bar .m { font-size: 12.5px; font-weight: 600; text-transform: capitalize; color: var(--muted-2); }
.bar[aria-pressed="true"] .m { color: var(--ink); }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; padding: 8px 0; font-size: 14px; }
.cat .track { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cat .track i { display: block; height: 100%; width: var(--w); background: var(--purple); border-radius: 99px; }

/* Perfil */

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>';
  var HOWS = ['', 'En ayunas', 'Con comida', 'Después de comer'];
  function treatById(id) { return findIn(state.treats, id); }
  function tTimes(t) {
    var seen = {};
    return (t.times || []).filter(function (x) { if (!/^\d{2}:\d{2}$/.test(x) || seen[x]) return false; seen[x] = 1; return true; }).sort();
  }
  function tActive(t, day) { day = day || todayStr(); return !!t && (!t.start || t.start <= day) && (!t.end || t.end >= day); }
  function tEnded(t) { return !!t.end && t.end < todayStr(); }
  function tLastChange(t) {
    return (t.history || []).filter(function (h) { return h.date > (t.start || ''); }).sort(function (a, b) { return b.date.localeCompare(a.date); })[0] || null;
  }
  function tNewDose(t) {
    var c = tLastChange(t);
    return c && c.date <= todayStr() && daysBetween(c.date, todayStr()) <= 7 ? c : null;
  }
  function tProgress(t) {
    var today = todayStr();
    if (t.start && t.start > today) return { txt: 'Empieza el ' + fmtDateShort(t.start), cls: 'soft' };
    if (!t.end) return { txt: 'Permanente', cls: 'soft' };
    if (t.end < today) return { txt: 'Terminó el ' + fmtDateShort(t.end), cls: 'soft', done: true };
    if (!t.start) return { txt: 'Hasta el ' + fmtDateShort(t.end), cls: 'ok' };
    var n = daysBetween(t.start, today) + 1, tot = daysBetween(t.start, t.end) + 1, left = daysBetween(today, t.end);
    return {
      txt: 'Día ' + n + ' de ' + tot, cls: left <= 3 ? 'warn' : 'ok', pct: Math.round(n / tot * 100),
      sub: left === 0 ? 'Hoy es el último día' : (left === 1 ? 'Termina mañana' : 'Termina el ' + fmtDate(t.end))
    };
  }
  function petTreats(petId) {
    return state.treats.filter(function (t) { return t.petId === petId; }).sort(function (a, b) {
      return (tTimes(a)[0] || '99').localeCompare(tTimes(b)[0] || '99') || String(a.name).localeCompare(String(b.name));
    });
  }
  function medLabel(t) { return t.name + (t.dose ? ' · ' + t.dose : ''); }
  function doseKey(tid, time, day) { return (day || todayStr()) + '_' + tid + '_' + String(time).replace(':', ''); }
  function doseOf(tid, time) { return findIn(state.doses, doseKey(tid, time)); }
  function whoName(d) {
    if (d.byId) return state.names[d.byId] || (d.byId === state.meId ? 'Tú' : 'Alguien');
    return d.by || 'Alguien';
  }
  function resolveNames() {
    if (!userNs || !userNs.profiles) return;
    var ids = [], seen = {};
    state.doses.forEach(function (d) { if (d.byId && !seen[d.byId]) { seen[d.byId] = 1; ids.push(d.byId); } });
    if (!ids.length) return;
    userNs.profiles(ids).then(function (ps) {
      var ch = false;
      ids.forEach(function (id) { var n = ps && ps[id] && ps[id].name; if (n && state.names[id] !== n) { state.names[id] = n; ch = true; } });
      if (ch) render();
    }, function () {});
  }
  function condNames(ids) { return (ids || []).map(condById).filter(Boolean).map(function (c) { return c.name; }); }

  /* Fila de medicamento dentro del plan diario. El check es silencioso: si nadie marca, no pasa nada. */
  function medRow(t, time, past) {
    var d = doseOf(t.id, time), pr = tProgress(t), nd = tNewDose(t), tags = '';

    var btn = state.canWrite ?
      '<button type="button" class="dose" data-action="dose" data-id="' + esc(t.id) + '" data-val="' + esc(time) + '" aria-pressed="' + !!d + '" aria-label="' + (d ? 'Quitar marca de ' : 'Marcar como dado: ') + esc(t.name) + '">' + CHECK + '</button>' :
      '<span class="dose" aria-hidden="true">' + (d ? CHECK : '') + '</span>';
    return '<li class="pmed' + (d ? ' done' : '') + (past && !d ? ' past' : '') + '">' + btn +
      '<button type="button" class="pmn" data-action="openTreat" data-id="' + esc(t.id) + '"><span class="pmname">' + esc(t.name) + '</span>' +
      (t.dose ? '<small>' + esc(t.dose) + '</small>' : '') + (tags ? '<span class="mtags">' + tags + '</span>' : '') +
      (d ? '<span class="pby">' + esc(whoName(d)) + (d.at ? ' · ' + esc(d.at) : '') + '</span>' : '') + '</button></li>';
  }

  function treatCard(t) {
    var pr = tProgress(t), nd = tNewDose(t);
    var conds = condNames(t.conds).map(function (n) { return '<span class="ctag">' + esc(n) + '</span>'; }).join('');
    return '<button type="button" class="tcard' + (pr.done ? ' ended' : '') + '" data-action="openTreat" data-id="' + esc(t.id) + '">' +
      '<span class="tname"><b>' + esc(t.name) + '</b>' + (t.dose ? '<span class="tdose">' + esc(t.dose) + '</span>' : '') + '</span>' +
      '<span class="badge ' + pr.cls + '">' + esc(pr.txt) + '</span>' +

      (t.how ? '<span>' + esc(t.how) + '</span>' : '') + conds +
      (nd ? '<span class="mtag new">Dosis nueva desde ' + esc(fmtDateShort(nd.date)) + '</span>' : '') +

  }

  function renderTreats() {
    var today = todayStr();
    var pets = state.petFilter === 'all' ? sortedPets() : [petById(state.petFilter)].filter(Boolean);
    var multi = pets.length > 1;
    var head = '<div class="sh"><h3 style="display:flex;align-items:center;gap:10px">' + secIcon('tratamiento') + 'Tratamientos</h3></div>' +

      (pets.length === 1 ? '<button class="btn ghost" data-action="ficha" data-id="' + esc(pets[0].id) + '">Ficha para compartir</button>' : '') + '</div>';
    var body = pets.map(function (p) {
      var ts = petTreats(p.id), act = ts.filter(function (t) { return !tEnded(t); });

        (done.length ? '<details class="tdone"><summary>Terminados (' + done.length + ')</summary><div class="tlist">' + done.map(treatCard).join('') + '</div></details>' : '') + '</div>';
    }).join('');

  }

  function openInfo(title, body, acts) {

  function fact(label, value) { return '<div><dt>' + esc(label) + '</dt><dd>' + esc(value) + '</dd></div>'; }

  function treatDetail(t) {
    var p = petById(t.petId), pr = tProgress(t), ts = tTimes(t), cn = condNames(t.conds);

      (t.how ? fact('Indicación', t.how) : '') + (t.start ? fact('Desde', fmtDate(t.start)) : '') + fact(t.end ? 'Último día' : 'Duración', t.end ? fmtDate(t.end) : 'Permanente') +
      (cn.length ? fact('Para', cn.join(', ')) : '') + '</dl>' +
      (pr.pct != null ? '<div class="tprog big" aria-hidden="true"><i style="--w:' + pr.pct + '%"></i></div><p class="tsub">' + esc(pr.txt + ' · ' + pr.sub) + '</p>' : '') +

        return '<div' + (i === 0 ? ' class="cur"' : '') + '><span>' + esc(h.date ? fmtDate(h.date) : 'Desde el inicio') + (i === 0 ? ' · actual' : '') + '</span><b>' + esc(h.dose || 'Sin indicar') + '</b>' +

      if (tActive(t) && t.end !== todayStr()) acts += '<button type="button" class="btn ghost" data-action="treatStop" data-id="' + esc(t.id) + '">Terminar hoy</button>';
      acts += '<button type="button" class="btn ghost" data-action="editTreat" data-id="' + esc(t.id) + '">Editar</button>';

  /* Ficha para compartir: vista fija, sin checks, para el veterinario o quien los cuide */
  function fichaData(p) {

    var withEnd = petTreats(p.id).filter(function (t) { return tActive(t) && t.end; });
    return {
      sub: [p.species, p.breed, ageText(p.birth), w ? fmtNum(w) + ' kg' : '', p.sex, p.neutered === 'Sí' ? 'esterilizado' : ''].filter(Boolean).join(' · '),
      allergies: p.allergies || 'Ninguna registrada',
      food: [p.foodBrand, p.foodDaily].filter(Boolean).join(' · '),

  }
  function fichaText(p) {
    var f = fichaData(p), L = [p.name.toUpperCase(), f.sub, '', 'Alergias: ' + f.allergies];

    if (f.conds.length) L.push('Condiciones: ' + f.conds.map(function (c) { return c.name + ' (' + String(c.status || '').toLowerCase() + ')'; }).join(', '));
    L.push('', 'HORARIO DIARIO');
    f.steps.forEach(function (s) {
      var parts = String(s.items || '').split(';').map(function (x) { return x.trim(); }).filter(Boolean);
      s.meds.forEach(function (t) { parts.push(medLabel(t)); });
      L.push(s.time + (s.title ? ' ' + s.title : '') + ': ' + parts.join('; '));
    });
    if (f.withEnd.length) { L.push('', 'TRATAMIENTOS CON FECHA DE TÉRMINO'); f.withEnd.forEach(function (t) { L.push(t.name + ': hasta el ' + fmtDate(t.end)); }); }

  function weightChart(ws) {

    function Y(v) { return T + (hi - v) / (hi - lo) * (H - T - B); }

    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');

        var key = (item && (item.linkKey || item.id)) || ('k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7));

      if (completes) p = p.then(function () { return db.collection('records').doc(completes).update({ nextDone: true }); });
      return p.then(function () { ctx.removed.filter(function (fid) { return !assetShared(fid, 'records', item && item.id); }).forEach(deleteAsset); });

  function viewRecord(rec) {
    var p = petById(rec.petId);
    var body = '<dl class="facts">' + fact('Tipo', recLabel(rec)) + fact('Fecha', fmtDate(rec.date)) + fact('Mascota', p ? p.name : 'Sin mascota');
    if (rec.type === 'peso' && rec.weight) body += fact('Peso', fmtNum(rec.weight) + ' kg');
    if (rec.type === 'incidente') {
      body += fact('Incidente', incLabel(rec.incType)) + (rec.zone ? fact('Zona', rec.zone) : '') +
        fact('Veterinario', rec.vet === 'no' ? 'No fue' : 'Sí fue') + fact('Estado', rec.status === 'resuelto' ? 'Resuelto' : 'En curso') +
        (rec.meds ? fact('Medicamentos', rec.meds) : '');
    }
    if (rec.nextDate) body += fact(rec.nextDone ? 'Próxima (ya hecha)' : 'Próxima fecha', fmtDate(rec.nextDate));
    if (rec.clinic) body += fact('Clínica o veterinario/a', rec.clinic);
    if (rec.cost > 0) body += fact('Costo', CLP.format(rec.cost));
    if (rec.type === 'receta') {
      if (rec.treatDays) body += fact('Tratamiento', rec.treatDays + ' días' + (rec.treatEnd ? ' (hasta ' + fmtDate(rec.treatEnd) + ')' : ''));
      if (rec.validUntil) body += fact('Receta válida hasta', fmtDate(rec.validUntil));
    }
    var cn = condNames(rec.conds);
    if (cn.length) body += fact(cn.length > 1 ? 'Patologías' : 'Patología', cn.join(', '));
    body += '</dl>';
    if (rec.notes) body += '<div class="pblock"><small>Notas</small><p>' + esc(rec.notes) + '</p></div>';
    var seen = {}, vr = [];
    (rec.conds || []).forEach(function (cid) {
      var c = condById(cid);
      ((c && c.indicators) || []).forEach(function (ind) {
        var v = (rec.vals || {})[ind.id];
        if (seen[ind.id] || !v || v.v == null || isNaN(v.v)) return;
        seen[ind.id] = 1;
        var out = (v.lo != null && v.v < v.lo) || (v.hi != null && v.v > v.hi);
        var ref = v.lo != null && v.hi != null ? fmtNum(v.lo) + '–' + fmtNum(v.hi) : v.hi != null ? 'máx. ' + fmtNum(v.hi) : v.lo != null ? 'mín. ' + fmtNum(v.lo) : '';
        if (ref) ref = ' <small>(' + ref + ')</small>';
        vr.push('<div><span>' + esc(ind.label) + '</span><span><b' + (out ? ' class="out"' : '') + '>' + esc(fmtNum(v.v) + (ind.unit ? ' ' + ind.unit : '')) + '</b>' + ref + '</span></div>');
      });
    });
    if (vr.length) body += '<div class="vals"><small style="padding-top:8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:700">Valores</small>' + vr.join('') + '</div>';
    var chips = (rec.files || []).map(function (f) { return fileChip(rec, f, f.kind === 'receta' ? 'Receta' : ''); });
    linkedRecs(rec).forEach(function (x) { (x.files || []).forEach(function (f) { chips.push(fileChip(x, f, x.type === 'receta' ? 'Receta' : 'Examen')); }); });
    if (chips.length) body += '<div class="wsec"><h3>Archivos</h3><div class="chips">' + chips.join('') + '</div></div>';
    var acts = state.canWrite ? '<button type="button" class="btn ghost" data-action="formRecord" data-id="' + esc(rec.id) + '">Editar</button>' : '';
    openInfo(rec.title + (p ? ' · ' + p.name : ''), body, acts);
  }

    el.innerHTML = '<div class="sheet wide" role="dialog" aria-label="Archivo"><div class="sheet-top"><h2>' + esc(file.name) + '</h2>' + '<button type="button" class="xbtn" data-sheet="cancel" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>' + '</div>' + body +
      '<p class="muted">' + esc(rec.title) + ' · ' + esc(p ? p.name : 'Compartido') + ' · ' + esc(fmtDate(rec.date)) + '</p>' +
      '<div class="sheet-actions"><span></span><div class="right">' +
      (downloadsNs ? '<button class="btn ghost" data-action="dlFile" data-rid="' + esc(rec.id) + '" data-fid="' + esc(file.id) + '">' + DL + 'Descargar</button>' : '') +
      (state.canWrite && !rec.noRec ? '<button class="btn ghost" data-action="editRecord" data-id="' + esc(rec.id) + '">Ver registro</button>' : '') +
      '<button class="btn" data-sheet="cancel">Cerrar</button></div></div></div>';
    el.hidden = false;
    sheetPushed();
    if (!img) renderPdf(document.getElementById('pdfview'), url, vctx);
  }

  /* ---------- visor de PDF dentro de la app ---------- */
  var PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  var pdfLibP = null;
  function loadScript(src) {
    return new Promise(function (ok, bad) {
      var sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc);
    });
  }
  function loadPdfLib() {
    if (!pdfLibP) {
      pdfLibP = loadScript(PDFJS + 'pdf.worker.min.js').then(function () { return loadScript(PDFJS + 'pdf.min.js'); }).then(function () {
        var lib = window.pdfjsLib;
        if (!lib) throw new Error('pdfjs');
        lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
        return lib;
      });
      pdfLibP.catch(function () { pdfLibP = null; });
    }
    return pdfLibP;
  }
  async function renderPdf(box, url, vctx) {
    function alive() { return sheetCtx === vctx && box.isConnected; }
    try {
      var lib = await loadPdfLib();
      var r = await fetch(url);
      if (!r.ok) throw new Error('fetch');
      var buf = await r.arrayBuffer();
      var doc = await lib.getDocument({ data: buf, isEvalSupported: false }).promise;
      if (!alive()) return;
      box.innerHTML = '';
      var w = Math.max(280, box.clientWidth - 20), dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      for (var i = 1; i <= doc.numPages; i++) {
        if (!alive()) return;
        var page = await doc.getPage(i);
        var vp0 = page.getViewport({ scale: 1 });
        var vp = page.getViewport({ scale: (w / vp0.width) * dpr });
        var c = document.createElement('canvas');
        c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
        c.setAttribute('aria-label', 'Página ' + i + ' de ' + doc.numPages);
        box.appendChild(c);
        if (doc.numPages > 1) { var pg = document.createElement('p'); pg.className = 'pdfpg'; pg.textContent = 'Página ' + i + ' de ' + doc.numPages; box.appendChild(pg); }
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
      }
    } catch (e) {
      if (!alive()) return;
      box.innerHTML = '<p class="pdfmsg">No se pudo mostrar este PDF aquí.' + (downloadsNs ? ' Puedes descargarlo con el botón Descargar.' : '') + '</p>';
    }
  }

  var EXT = { 'application/pdf': 'pdf', 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' };
  function dlName(file) {
    var name = String(file.name || 'archivo').trim() || 'archivo';
    var m = name.match(/\.([a-z0-9]+)$/i);
    if (m && ['pdf', 'jpg', 'jpeg', 'png', 'webp', 'gif'].indexOf(m[1].toLowerCase()) >= 0) return name;
    return name + '.' + (EXT[file.type] || 'pdf');
  }
  async function downloadFile(file, btn) {
    if (!downloadsNs) return;
    if (btn) btn.disabled = true;
    try {
      var r = await fetch(blobUrl(file.id));
      if (!r.ok) throw { code: 'fetch' };
      var blob = await r.blob();
      await downloadsNs.save({ filename: dlName(file), data: blob });
      toast('Descarga lista');
    } catch (e) {
      var c = e && e.code;
      if (c === 'declined') { /* la persona dijo que no */ }
      else if (c === 'rate_limited') toast('Ya hay una descarga esperando confirmación.');
      else toast('No se pudo descargar el archivo.');
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  function saveDoc(col, id, data) {
    var c = db.collection(col);
    return id ? c.doc(id).set(data) : c.add(data);
  }
  function findIn(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }

  /* ---------- eventos ---------- */
  document.addEventListener('click', function (e) {
    var np = document.getElementById('notif');
    if (np && !np.hidden && !e.target.closest('#bell')) {
      var inside = e.target.closest('#notif');
      if (!inside || e.target.closest('[data-action]')) toggleNotif(false);
    }
    if (e.target.closest('#cropper')) return;
    var crp = e.target.closest('[data-file-crop]');
    if (crp && sheetCtx && sheetCtx.files) {
      var cu = Number(crp.getAttribute('data-file-crop')), cf = null;
      sheetCtx.files.forEach(function (f) { if (f.uid === cu) cf = f; });
      if (cf) openCropper(sheetCtx, cf);
      return;
    }
    var clr = e.target.closest('[data-photos-clear]');
    if (clr && sheetCtx && sheetCtx.files) {
      if (!clr.hasAttribute('data-armed')) { clr.setAttribute('data-armed', ''); clr.textContent = '¿Seguro? Toca de nuevo para quitar todas'; return; }
      var cc = sheetCtx;
      cc.files = cc.files.filter(function (f) {
        if (f.slot !== 'photo') return true;
        if (f.id) { var u2 = cc.uploaded.indexOf(f.id); if (u2 >= 0) { cc.uploaded.splice(u2, 1); deleteAsset(f.id); } else cc.removed.push(f.id); }
        return false;
      });
      renderFiles(cc);
      toast('Fotos quitadas. Toca Guardar para confirmar.');
      return;
    }
    var fst = e.target.closest('[data-file-first]');
    if (fst && sheetCtx && sheetCtx.files) {
      var fu = Number(fst.getAttribute('data-file-first')), cx = sheetCtx, fi = -1;
      cx.files.forEach(function (f, i) { if (f.uid === fu) fi = i; });
      if (fi >= 0) { var mv = cx.files.splice(fi, 1)[0]; var firstPh = -1; cx.files.forEach(function (f, i) { if (firstPh < 0 && f.slot === 'photo') firstPh = i; }); cx.files.splice(firstPh < 0 ? 0 : firstPh, 0, mv); renderFiles(cx); }
      return;
    }
    var rm = e.target.closest('[data-file-remove]');
    if (rm && sheetCtx && sheetCtx.files) {
      var uid = Number(rm.getAttribute('data-file-remove')), ctx0 = sheetCtx;
      var idx = -1;
      ctx0.files.forEach(function (f, i) { if (f.uid === uid) idx = i; });
      if (idx >= 0) {
        var f = ctx0.files.splice(idx, 1)[0];
        if (f.id) {
          var u = ctx0.uploaded.indexOf(f.id);
          if (u >= 0) { ctx0.uploaded.splice(u, 1); deleteAsset(f.id); } else { ctx0.removed.push(f.id); }
        }
        renderFiles(ctx0);
      }
      return;
    }
    var sh = e.target.closest('[data-sheet]');
    if (sh && sheetCtx) {
      if (sh.dataset.sheet === 'cancel') return closeSheet();
      if (sh.dataset.sheet === 'delete') {
        if (!sh.hasAttribute('data-armed')) {
          sh.setAttribute('data-armed', '1');
          sh.textContent = sheetCtx.deleteWarning ? 'Confirmar: eliminar todo' : 'Confirmar eliminación';
          if (sheetCtx.deleteWarning) toast(sheetCtx.deleteWarning);
          return;
        }
        sh.disabled = true;
        var ctx = sheetCtx;
        Promise.resolve().then(function () { return ctx.onDelete(); }).then(function () { closeSheet(); toast('Eliminado'); })
          .catch(function () { sh.disabled = false; toast('No se pudo eliminar. Intenta de nuevo.'); });
      }
      return;
    }
    if (e.target.id === 'sheet') return closeSheet();
    var a = e.target.closest('[data-action]');
    if (!a) return;
    var act = a.dataset.action, id = a.dataset.id, v = a.dataset.val;
    var writes = { incResolve: 1, incToCond: 1, addRecord: 1, addType: 1, addVac: 1, addWeight: 1, addExpense: 1, addDeworm: 1, addPet: 1, addCond: 1, formRecord: 1, formExpense: 1, editWeight: 1, editPet: 1, editCond: 1, pendDone: 1, addTreat: 1, editTreat: 1, treatDose: 1, treatStop: 1, dose: 1, regMenu: 1, pendDismiss: 1 };
    if (writes[act] && !state.canWrite) return;
    if (writes[act] && !db) return;
    if ((act === 'addRecord' || act === 'addType' || act === 'addVac' || act === 'addDeworm' || act === 'addTreat' || act === 'regMenu' || act === 'addCond' || act === 'addWeight' || act === 'addExpense') && !state.pets.length) { toast('Primero agrega una mascota.'); return petForm(null); }
    switch (act) {
      case 'tab':
        if (sheetCtx) closeSheet();
        state.tab = a.dataset.tab; lsSet('cm_tab', state.tab);
        if (state.tab === 'salud') { state.saludCat = ''; if (a.dataset.cat === 'all') { state.saludView = 'cron'; lsSet('cm_sview', 'cron'); } }
        render(); window.scrollTo(0, 0); break;
      case 'pet': state.petFilter = (v !== 'all' && state.petFilter === v) ? 'all' : v; lsSet('cm_pet', state.petFilter); render(); break;
      case 'typeFilter': state.typeFilter = v; render(); break;
      case 'pickMonth': state.month = v; render(); break;
      case 'monthStep': var nm = addMonths(state.month || thisMonth(), Number(v)); if (nm <= thisMonth()) { state.month = nm; render(); } break;
      case 'toggleWeights': state.weightsAll[id] = !state.weightsAll[id]; render(); break;
      case 'saludView': state.saludView = v; state.saludCat = ''; lsSet('cm_sview', v); render(); break;
      case 'incResolve':
        db.collection('records').doc(id).update({ status: 'resuelto' }).then(function () { toast('Marcado como resuelto'); }).catch(function () { toast('No se pudo actualizar. Intenta de nuevo.'); });
        break;
      case 'goInc':
        state.tab = 'salud'; state.saludView = 'res'; state.saludCat = 'incidente'; lsSet('cm_tab', 'salud'); render(); window.scrollTo(0, 0);
        break;
      case 'incToCond':
        var ir = findIn(state.records, id);
        if (ir) { closeSheet(); condForm(null, ir.petId, { name: ir.title, notes: (ir.notes || ''), tag: [ir.id] }); }
        break;
      case 'bell':
        if (sheetCtx) closeSheet();
        toggleNotif();
        break;
      case 'noop': break;
      case 'saludCat': state.saludCat = v || ''; render(); window.scrollTo(0, 0); break;
      case 'addType': recordForm(null, { type: v, title: '' }); break;
      case 'addVac': recordForm(null, { type: 'vacuna', vac: v || 'octuple', title: '' }); break;
      case 'toggleCond': state.condAll[id] = !state.condAll[id]; render(); break;
      case 'pickCond':
        var pc = findIn(state.conds, id);
        if (pc) { state.condPick[pc.petId] = pc.id; render(); }
        break;
      case 'jumpCond':
        var tgt = document.getElementById('cond-' + id);
        if (tgt) tgt.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
        break;
      case 'regMenu': regMenu(); break;
      case 'addTreat': treatForm(null, { petId: defaultPetId() }); break;
      case 'openTreat': var ot = treatById(id); if (ot) treatDetail(ot); break;
      case 'editTreat': var et = treatById(id); if (et) treatForm(et); break;
      case 'treatDose': var tdx = treatById(id); if (tdx) doseForm(tdx); break;
      case 'treatStop':
        var tsx = treatById(id);
        if (tsx) db.collection('treatments').doc(id).update({ end: todayStr() < tsx.start ? tsx.start : todayStr() }).then(function () { closeSheet(); toast('Listo: hoy es su último día'); }).catch(function () { toast('No se pudo actualizar. Intenta de nuevo.'); });
        break;
      case 'dose':
        var dk = doseKey(id, v), dx = findIn(state.doses, dk), dt0 = treatById(id);
        if (dt0) (dx ? db.collection('doses').doc(dk).delete() : db.collection('doses').doc(dk).set({ date: todayStr(), tid: id, petId: dt0.petId, time: v, byId: state.meId || '', by: state.meId ? '' : (state.meName || 'Tú'), at: nowHM() }))
          .catch(function () { toast('No se pudo guardar. Intenta de nuevo.'); });
        break;
      case 'ficha': var fpx = petById(id); if (fpx) fichaSheet(fpx); break;
      case 'copyFicha': copyFicha(); break;
      case 'openTreatFile':
        var tfx = treatById(a.dataset.rid), tff = null;
        if (tfx) (tfx.files || []).forEach(function (x) { if (x.id === a.dataset.fid) tff = x; });
        if (tfx && tff) openViewer({ id: tfx.id, title: tfx.name, petId: tfx.petId, date: tfx.start, noRec: true }, tff);
        break;
      case 'addCond': condForm(null, id); break;
      case 'editCond': var cd = findIn(state.conds, id); if (cd) condForm(cd); break;
      case 'goCond':
        var gc = findIn(state.conds, id);
        if (gc) {
          state.tab = 'salud'; state.saludView = 'cond'; state.petFilter = gc.petId; state.condPick[gc.petId] = gc.id;
          lsSet('cm_tab', 'salud'); lsSet('cm_sview', 'cond'); lsSet('cm_pet', gc.petId);
          render();
          window.scrollTo(0, 0);
        }
        break;
      case 'addRecord': recordForm(null); break;
      case 'addDeworm': recordForm(null, { type: 'desparasitacion', parasite: v || 'interna' }); break;
      case 'addWeight': weightForm(null, id); break;
      case 'addExpense': expenseForm(null); break;
      case 'addPet': petForm(null); break;
      case 'editRecord': var rec = findIn(state.records, id); if (rec) viewRecord(rec); break;
      case 'formRecord': var frec = findIn(state.records, id); if (frec) recordForm(frec); break;
      case 'editWeight': var wr = findIn(state.records, id); if (wr) weightForm(wr); break;
      case 'editExpense': var vx = findIn(state.expenses, id); if (vx) viewExpense(vx); break;
      case 'formExpense': var fx = findIn(state.expenses, id); if (fx) expenseForm(fx); break;
      case 'editPet': petForm(findIn(state.pets, id), !!a.dataset.photos); break;
      case 'openFile':
        var fr = findIn(state.records, a.dataset.rid), ff = null;
        if (fr) (fr.files || []).forEach(function (x) { if (x.id === a.dataset.fid) ff = x; });
        if (fr && ff) openViewer(fr, ff);
        break;
      case 'zoomImg':
        var iw = document.getElementById('imgwrap');
        if (iw) iw.classList.toggle('zoom');
        break;
      case 'dlFile':
        var dr = findIn(state.records, a.dataset.rid), df = null;
        if (dr) (dr.files || []).forEach(function (x) { if (x.id === a.dataset.fid) df = x; });
        if (df) downloadFile(df, a);
        break;
      case 'pendDone':
        var src = findIn(state.records, id);
        if (src) recordForm(null, src.type === 'desparasitacion' && !src.nextType ? { petId: src.petId, type: 'desparasitacion', parasite: paraOf(src), title: src.title, date: todayStr() } : { petId: src.petId, type: src.nextType || src.type, title: src.nextLabel || src.title, clinic: src.clinic, conds: src.conds, date: todayStr() }, src.id);
        break;
      case 'pendDismiss':
        db.collection('records').doc(id).update({ nextDone: true }).then(function () { toast('Descartado'); }).catch(function () { toast('No se pudo actualizar. Intenta de nuevo.'); });
        break;
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { var np = document.getElementById('notif'); if (np && !np.hidden) { toggleNotif(false); document.getElementById('bell').focus(); return; } if (sheetCtx) closeSheet(); }
  });
  window.addEventListener('resize', function () { renderNotif(); });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });
  document.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t.tagName === 'IMG' && t.hasAttribute('data-hfall')) { t.remove(); return; }
    if (t && t.tagName === 'IMG' && t.hasAttribute('data-blob')) {
      var ph = document.createElement('span');
      ph.className = 'pdfmark';
      ph.textContent = 'Sin vista previa';
      t.replaceWith(ph);
    }
  }, true);

  /* ---------- datos ---------- */
  function memoryDb() {
    var cols = {};
    function col(name) {
      if (cols[name]) return cols[name];
      var m = new Map(), subs = [], n = 0;
      function snap() { return { docs: Array.from(m.entries()).map(function (en) { return { id: en[0], data: function () { return en[1]; } }; }) }; }
      function emit() { subs.forEach(function (f) { f(snap()); }); }
      cols[name] = {
        onSnapshot: function (f) { subs.push(f); setTimeout(function () { f(snap()); }, 0); return function () {}; },
        add: function (d) { m.set('m' + (++n) + Date.now(), d); emit(); return Promise.resolve(); },
        doc: function (id) {
          return {
            set: function (d) { m.set(id, d); emit(); return Promise.resolve(); },
            update: function (d) { m.set(id, Object.assign({}, m.get(id), d)); emit(); return Promise.resolve(); },
            delete: function () { m.delete(id); emit(); return Promise.resolve(); }
          };
        }
      };
      return cols[name];
    }
    return { collection: col };
  }

  /* Datos de ejemplo: solo se cargan en la vista previa (fuera de la app publicada), para poder ver el diseño. */
  function seedDemo() { /* sin datos de ejemplo en la versión pública */ }

  function subscribe() {
    var KEYS = { conditions: 'conds', treatments: 'treats' };
    ['pets', 'records', 'expenses', 'conditions', 'treatments', 'doses'].forEach(function (name) {
      var key = KEYS[name] || name;
      db.collection(name).onSnapshot(function (snap) {
        state[key] = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
        state.loaded[key] = true;
        if (key === 'doses') resolveNames();
        render();
      }, function () { state.error = true; render(); });
    });
  }

  async function boot() {
    var t = lsGet('cm_tab'), p = lsGet('cm_pet');
    if (t === 'mascotas') t = 'perfil';
    if (t && TABS.indexOf(t) >= 0) state.tab = t;
    if (p) state.petFilter = p;
    var sv = lsGet('cm_sview');
    if (sv === 'res' || sv === 'cron' || sv === 'cond') state.saludView = sv;
    var d = null, u = null, a = null, can = window.claude && window.claude.use;
    try { if (can) d = await window.claude.use('db'); } catch (e) { d = null; }
    try { if (can) u = await window.claude.use('user'); } catch (e) { u = null; }
    try { if (can) a = await window.claude.use('assets'); } catch (e) { a = null; }
    assetsNs = a;
    if (can) { try { window.claude.use('downloads').then(function (x) { downloadsNs = x || null; if (downloadsNs && db) render(); }, function () {}); } catch (e) { /* sin descargas */ } }
    if (u) { try { if ((await u.can('data.write')) === false) state.canWrite = false; } catch (e) { /* se mantiene */ } }
    if (u) { try { var me = await u.me(); state.meId = (me && me.id) || ''; } catch (e) { /* sin identidad */ } }
    userNs = u;
    if (!d) {
      d = memoryDb();
      state.memory = true;
      if (!can || PREVIEW) { state.demo = true; seedDemo(d); }
    }
    db = d;
    render();
    subscribe();
  }
  boot();
})();
</script>
